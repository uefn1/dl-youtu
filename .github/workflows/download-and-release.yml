name: Download YouTube & Release

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'YouTube video URL'
        required: true
        type: string

permissions:
  contents: write   # Release作成・アップロードに必須

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install yt-dlp + EJS solver
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade yt-dlp curl-cffi yt-dlp-ejs

      - name: Start PO Token Provider (bgutil)
        run: |
          docker run -d --name bgutil-provider --init \
            -p 127.0.0.1:4416:4416 \
            brainicism/bgutil-ytdlp-pot-provider

      - name: Setup Cloudflare WARP proxy
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update && sudo apt-get install -y cloudflare-warp
          warp-cli --accept-tos registration new
          warp-cli --accept-tos mode proxy
          warp-cli --accept-tos proxy port 40000
          warp-cli --accept-tos connect
          sleep 5

      - name: Download video (with retry)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 30
          command: |
            yt-dlp \
              --impersonate chrome \
              --extractor-args "youtube:player_client=default,-tv,-web_embedded" \
              --remote-components ejs:github \
              --proxy "socks5://127.0.0.1:40000" \
              --sleep-interval 5 \
              --max-filesize 500M \
              -o "%(title)s.%(ext)s" \
              "${{ github.event.inputs.video_url }}"

      # 1.9GiB以上ならTS分割、未満ならそのまま
      - name: Split oversized video into TS segments
        id: split
        run: |
          shopt -s nullglob
          FILES=(*.mp4 *.webm *.mkv)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "No video file found." >&2
            exit 1
          fi

          INPUT="${FILES[0]}"
          SIZE=$(stat -c%s "$INPUT")
          LIMIT=$((1900 * 1024 * 1024))   # 1.9GiB弱（安全マージン込み）

          echo "Input: $INPUT ($SIZE bytes)"

          if [ "$SIZE" -ge "$LIMIT" ]; then
            echo "Splitting into TS segments..."
            # サイズベース分割。1セグメントあたり約1.8GiB以下に収める
            ffmpeg -hide_banner -loglevel error \
              -i "$INPUT" \
              -c copy \
              -f segment \
              -segment_format mpegts \
              -segment_size 1800M \
              -reset_timestamps 1 \
              -segment_list "segments.csv" \
              "part_%03d.ts"

            rm -f "$INPUT"
            echo "SPLIT=true" >> $GITHUB_OUTPUT
          else
            echo "File is under 1.9GiB; uploading as-is."
            echo "SPLIT=false" >> $GITHUB_OUTPUT
          fi

          ls -lh

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: download-${{ github.run_id }}
          name: "YouTube Download ${{ github.run_id }}"
          body: |
            Source: ${{ github.event.inputs.video_url }}
            Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          files: |
            *.ts
            *.mp4
            *.webm
            *.mkv
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
